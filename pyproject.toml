[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-fast-mcp"
version = "0.1.0"
description = "MCP server for Odoo."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Mark Okolov", email = "okolovmark@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = ["odoo", "mcp", "erp", "integration", "rpc", "model-context-protocol"]

dependencies = [
    "OdooRPC==0.10.1",
    "fastmcp==2.14.4",
    "python-dotenv>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/okolovmark/odoo-fast-mcp"
Repository = "https://github.com/okolovmark/odoo-fast-mcp.git"

[project.optional-dependencies]
dev = ["ruff", "ty"]

# Entry point to run the server
[project.scripts]
odoo-fast-mcp = "odoo_fast_mcp.server:main_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "BLE",        # flake8-blind-except
    "C",          # flake8-comprehensions
    "COM",        # flake8-commas
    "E",          # pycodestyle Error
    "EM",         # flake8-errmsg
    "EXE",        # flake8-executable
    "F",          # Pyflakes
    "FA",         # flake8-future-annotations
    "FLY",        # flynt
    "G",          # flake8-logging-format
    "I",          # isort
    "ICN",        # flake8-import-conventions
    "INT",        # flake8-gettext
    "ISC",        # flake8-implicit-str-concat
    "LOG",        # flake8-logging
    "PGH",        # pygrep-hooks
    "PIE",        # flake8-pie
    "PLC",        # Pylint Convention
    "PLE",        # Pylint Error
    "PLW",        # Pylint Warning
    "PYI",        # flake8-pyi
    "RET",        # flake8-return
    "RUF",        # Ruff-specific rules
    "SIM",        # flake8-simplify
    "SLOT",       # flake8-slots
    "T",          # flake8-print
    "TC",         # flake8-type-checking
    "TID",        # flake8-tidy-imports
    "TRY",        # tryceratops
    "UP",         # pyupgrade
    "W",          # pycodestyle Warning
    "YTT"         # flake8-2020
    ]
ignore = [
    "C408",       # unnecessary-collection-call
    "C420",       # unnecessary-dict-comprehension-for-iterable
    "C901",       # complex-structure
    "E266",       # multiple-leading-hashes-for-block-comment
    "E501",       # line-too-long
    "E713",       # not-in-test
    "EM102",      # f-string-in-exception
    "FA100",      # future-rewritable-type-annotation
    "PGH003",     # blanket-type-ignore
    "PIE790",     # unnecessary-placeholder
    "PIE808",     # unnecessary-range-start
    "PLC2701",    # import-private-name
    "PLW2901",    # redefined-loop-name
    "RUF001",     # ambiguous-unicode-character-string
    "RUF005",     # collection-literal-concatenation
    "RUF012",     # mutable-class-default
    "RUF100",     # unused-noqa
    "SIM102",     # collapsible-if
    "SIM108",     # if-else-block-instead-of-if-exp
    "SIM117",     # multiple-with-statements
    "TID252",     # relative-imports
    "TRY003",     # raise-vanilla-args
    "TRY300",     # try-consider-else
    "TRY400",     # error-instead-of-exception
    "UP031",      # printf-string-formatting
    ]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
